<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пиратское 3-в-ряд</title>
    <style>
        /* ======================== Базовые сбросы и шрифты ======================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a1a2e 0%, #1c3b5a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ======================== Главный контейнер игры ======================== */
        .game-container {
            background: linear-gradient(180deg, #3e2c1a 0%, #5a3a20 100%);
            border: 4px solid #b8860b;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,215,0,0.2);
            max-width: 500px;
            width: 95%;
        }

        /* ======================== Шапка (счёт, название) ======================== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #f5d742;
            text-shadow: 2px 2px 4px #000;
        }

        .game-title {
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .score-box {
            background: #1a1a1a;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            border: 2px solid #b8860b;
        }

        .button-restart {
            background: #b8860b;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .button-restart:hover {
            background: #daa520;
            transform: scale(1.05);
        }

        /* ======================== Игровая доска ======================== */
        .board-wrapper {
            position: relative;
            width: 100%;
            /* Соотношение сторон 1:1 */
            aspect-ratio: 1 / 1;
            background: #2a1f0e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }

        .board {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            padding: 4px;
        }

        /* Каждая ячейка — контейнер для фишки */
        .cell {
            position: relative;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cell:hover {
            background: rgba(255,215,0,0.15);
        }
        .cell.selected {
            background: rgba(255,215,0,0.35);
            box-shadow: 0 0 0 3px #ffd700;
        }

        /* Фишка внутри ячейки */
        .tile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 6px;
            transition: transform 0.25s ease, opacity 0.25s ease;
            will-change: transform, opacity;
            /* Цвета фишек — пиратская палитра */
        }
        .tile[data-type="0"] { background: #b22222; }  /* череп — красный */
        .tile[data-type="1"] { background: #8b4513; }  /* сундук — коричневый */
        .tile[data-type="2"] { background: #2e8b57; }  /* карта — зелёный */
        .tile[data-type="3"] { background: #4682b4; }  /* якорь — синий */
        .tile[data-type="4"] { background: #daa520; }  /* компас — золотой */
        .tile[data-type="5"] { background: #708090; }  /* монета — серый */

        /* Анимация исчезновения при совпадении */
        .tile.removing {
            animation: popOut 0.3s ease forwards;
        }
        @keyframes popOut {
            0%   { transform: scale(1); opacity: 1; }
            50%  { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Анимация падения (гравитация) — используется transition, но для новых фишек можно keyframes */
        .tile.dropping {
            animation: dropIn 0.3s ease-out forwards;
        }
        @keyframes dropIn {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* ======================== Адаптивность ======================== */
        @media (max-width: 480px) {
            .game-title { font-size: 1.2rem; }
            .score-box { font-size: 1rem; padding: 4px 12px; }
            .tile { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">🏴‍☠️ Пиратский ряд</div>
            <div class="score-box">Очки: <span id="scoreDisplay">0</span></div>
            <button class="button-restart" id="restartBtn">♻️ Новая игра</button>
        </div>
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ======================== Конфигурация ========================
            const ROWS = 8;
            const COLS = 8;
            const TYPES = 6;               // количество типов фишек
            const BASE_SCORE = 10;          // очки за одну фишку в совпадении

            // Символы для отображения (пиратские мотивы)
            const SYMBOLS = ['☠', '📦', '🗺', '⚓', '🧭', '💰'];

            // ======================== Состояние игры ========================
            let grid = [];                   // 2D-массив: grid[row][col] = тип (0..TYPES-1)
            let score = 0;
            let selectedCell = null;         // { row, col } или null
            let isAnimating = false;         // блокировка ввода во время анимаций
            let boardElement = document.getElementById('board');
            let scoreDisplay = document.getElementById('scoreDisplay');

            // ======================== Генерация поля без начальных совпадений ========================
            // Для каждой ячейки слева направо, сверху вниз выбираем случайный тип,
            // проверяем, не образуется ли тройка слева (2 одинаковых) или сверху (2 одинаковых).
            // Если образуется — перевыбираем (до 100 попыток).
            function generateBoard() {
                const newGrid = [];
                for (let r = 0; r < ROWS; r++) {
                    const row = [];
                    for (let c = 0; c < COLS; c++) {
                        let type;
                        let attempts = 0;
                        do {
                            type = Math.floor(Math.random() * TYPES);
                            attempts++;
                            if (attempts > 100) break; // защита от бесконечного цикла
                        } while (
                            // Проверка горизонтальной тройки слева
                            (c >= 2 && row[c-1] === type && row[c-2] === type) ||
                            // Проверка вертикальной тройки сверху
                            (r >= 2 && newGrid[r-1][c] === type && newGrid[r-2][c] === type)
                        );
                        row.push(type);
                    }
                    newGrid.push(row);
                }
                return newGrid;
            }

            // ======================== Поиск всех совпадений (3+ в ряд) ========================
            // Возвращает массив объектов { row, col } для всех фишек, входящих в совпадения.
            function findAllMatches() {
                const matched = new Set();   // будем хранить строковые ключи "r,c"

                // Горизонтальные совпадения
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; ) {
                        const type = grid[r][c];
                        if (type === -1) { c++; continue; } // -1 быть не должно, но на всякий
                        let end = c + 1;
                        while (end < COLS && grid[r][end] === type) end++;
                        if (end - c >= 3) {
                            for (let i = c; i < end; i++) {
                                matched.add(`${r},${i}`);
                            }
                        }
                        c = end;
                    }
                }

                // Вертикальные совпадения
                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS; ) {
                        const type = grid[r][c];
                        if (type === -1) { r++; continue; }
                        let end = r + 1;
                        while (end < ROWS && grid[end][c] === type) end++;
                        if (end - r >= 3) {
                            for (let i = r; i < end; i++) {
                                matched.add(`${i},${c}`);
                            }
                        }
                        r = end;
                    }
                }

                // Преобразуем Set в массив координат
                const result = [];
                matched.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    result.push({ row: r, col: c });
                });
                return result;
            }

            // ======================== Удаление совпадений и обновление счёта ========================
            function removeMatches(matches) {
                score += matches.length * BASE_SCORE;
                matches.forEach(({ row, col }) => {
                    grid[row][col] = -1;   // помечаем как пустую
                });
                updateScore();
            }

            // ======================== Гравитация (сдвиг вниз) ========================
            // Алгоритм: для каждой колонки снизу вверх находим пустые ячейки и сдвигаем
            // непустые вниз. Возвращает массив перемещений для анимации.
            function applyGravity() {
                const moves = []; // { fromRow, fromCol, toRow, toCol }

                for (let c = 0; c < COLS; c++) {
                    // Собираем непустые фишки снизу вверх
                    const columnTiles = [];
                    for (let r = ROWS - 1; r >= 0; r--) {
                        if (grid[r][c] !== -1) {
                            columnTiles.push(grid[r][c]);
                        }
                    }
                    // Заполняем колонку снизу вверх непустыми, остальное - -1
                    for (let r = ROWS - 1; r >= 0; r--) {
                        const idx = ROWS - 1 - r;
                        if (idx < columnTiles.length) {
                            grid[r][c] = columnTiles[idx];
                        } else {
                            grid[r][c] = -1;
                        }
                    }
                    // Теперь нужно определить, куда переместились существующие фишки
                    // Для анимации: нам нужно delta между старой и новой позицией.
                    // Но для простоты мы пересоздадим DOM-элементы после всех каскадов.
                    // Анимацию падения сделаем через CSS класс при рендеринге.
                }
                return moves; // для упрощения оставим пустым, анимацию сделаем позже
            }

            // ======================== Заполнение пустот сверху новыми фишками ========================
            function refillBoard() {
                const newTiles = []; // { row, col, type }
                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS; r++) {
                        if (grid[r][c] === -1) {
                            const type = Math.floor(Math.random() * TYPES);
                            grid[r][c] = type;
                            newTiles.push({ row: r, col: c, type });
                        }
                    }
                }
                return newTiles;
            }

            // ======================== Проверка наличия возможных ходов ========================
            // Если ни один обмен соседних фишек не приводит к совпадению, поле "мертво".
            function hasValidMoves() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        // Проверяем обмен с правым соседом
                        if (c + 1 < COLS) {
                            swapInGrid(r, c, r, c + 1);
                            if (findAllMatches().length > 0) {
                                swapInGrid(r, c, r, c + 1); // откатываем
                                return true;
                            }
                            swapInGrid(r, c, r, c + 1); // откатываем
                        }
                        // Проверяем обмен с нижним соседом
                        if (r + 1 < ROWS) {
                            swapInGrid(r, c, r + 1, c);
                            if (findAllMatches().length > 0) {
                                swapInGrid(r, c, r + 1, c);
                                return true;
                            }
                            swapInGrid(r, c, r + 1, c);
                        }
                    }
                }
                return false;
            }

            // ======================== Вспомогательная функция обмена в сетке ========================
            function swapInGrid(r1, c1, r2, c2) {
                const temp = grid[r1][c1];
                grid[r1][c1] = grid[r2][c2];
                grid[r2][c2] = temp;
            }

            // ======================== Перетасовка поля (при deadlock) ========================
            function shuffleBoard() {
                // Просто собираем все типы в массив, перемешиваем и раскладываем обратно
                const allTypes = [];
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        allTypes.push(grid[r][c]);
                    }
                }
                // Перемешиваем Fisher-Yates
                for (let i = allTypes.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allTypes[i], allTypes[j]] = [allTypes[j], allTypes[i]];
                }
                let idx = 0;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        grid[r][c] = allTypes[idx++];
                    }
                }
                // После перемешивания могут возникнуть совпадения — удаляем их
                let matches = findAllMatches();
                while (matches.length > 0) {
                    removeMatches(matches);
                    applyGravity();
                    refillBoard();
                    matches = findAllMatches();
                }
                // Если всё ещё нет ходов — рекурсивно вызываем shuffle (но редкость)
                if (!hasValidMoves()) {
                    shuffleBoard();
                }
            }

            // ======================== Основной игровой цикл каскада ========================
            // Вызывается после успешного обмена. Рекурсивно обрабатывает совпадения,
            // гравитацию, заполнение, пока не останется совпадений.
            function processCascade(resolve) {
                let matches = findAllMatches();
                if (matches.length === 0) {
                    // Нет совпадений — проверяем deadlock
                    if (!hasValidMoves()) {
                        shuffleBoard();
                        renderBoard();
                    }
                    isAnimating = false;
                    if (resolve) resolve();
                    return;
                }

                // Удаляем совпадения (обновляем счёт, помечаем -1)
                removeMatches(matches);
                // Помечаем совпавшие ячейки для анимации (добавляем класс 'removing')
                matches.forEach(({ row, col }) => {
                    const cell = getCellElement(row, col);
                    if (cell) {
                        const tile = cell.querySelector('.tile');
                        if (tile) tile.classList.add('removing');
                    }
                });

                // Ждём окончания анимации исчезновения (300ms)
                setTimeout(() => {
                    // Применяем гравитацию (сдвиг вниз)
                    applyGravity();
                    // Заполняем пустоты
                    const newTiles = refillBoard();

                    // Перерисовываем доску (обновляем DOM)
                    renderBoard();

                    // Добавляем класс dropping для новых фишек
                    newTiles.forEach(({ row, col }) => {
                        const cell = getCellElement(row, col);
                        if (cell) {
                            const tile = cell.querySelector('.tile');
                            if (tile) tile.classList.add('dropping');
                        }
                    });

                    // После небольшой задержки (анимация падения) рекурсивно проверяем новые совпадения
                    setTimeout(() => {
                        processCascade(resolve);
                    }, 350);
                }, 350);
            }

            // ======================== Обработка клика (выбор и обмен) ========================
            function handleCellClick(row, col) {
                if (isAnimating) return;

                if (selectedCell === null) {
                    // Выбираем первую фишку
                    selectedCell = { row, col };
                    highlightCell(row, col, true);
                } else {
                    // Уже выбрана фишка
                    const sr = selectedCell.row;
                    const sc = selectedCell.col;

                    // Если кликнули на ту же — снимаем выделение
                    if (sr === row && sc === col) {
                        highlightCell(sr, sc, false);
                        selectedCell = null;
                        return;
                    }

                    // Проверяем соседство (по горизонтали или вертикали, не диагональ)
                    const dr = Math.abs(sr - row);
                    const dc = Math.abs(sc - col);
                    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                        // Обмен
                        isAnimating = true;
                        highlightCell(sr, sc, false);
                        selectedCell = null;

                        // Выполняем обмен в сетке
                        swapInGrid(sr, sc, row, col);
                        // Перерисовываем доску для визуального обмена
                        renderBoard();

                        // Проверяем, есть ли совпадения после обмена
                        const matches = findAllMatches();
                        if (matches.length > 0) {
                            // Успешный обмен — запускаем каскад
                            processCascade(() => {
                                // После каскада снимаем блокировку
                            });
                        } else {
                            // Неудачный обмен — откатываем обратно
                            swapInGrid(sr, sc, row, col);
                            renderBoard();
                            // Можно добавить анимацию shake (опустим для краткости)
                            isAnimating = false;
                        }
                    } else {
                        // Клик не на соседнюю — выбираем новую фишку
                        highlightCell(sr, sc, false);
                        selectedCell = { row, col };
                        highlightCell(row, col, true);
                    }
                }
            }

            // ======================== Работа с DOM ========================
            function getCellElement(row, col) {
                return boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            }

            function highlightCell(row, col, state) {
                const cell = getCellElement(row, col);
                if (cell) {
                    if (state) cell.classList.add('selected');
                    else cell.classList.remove('selected');
                }
            }

            // Рендерит всё поле на основе grid
            function renderBoard() {
                boardElement.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', (function(row, col) {
                            return function() { handleCellClick(row, col); };
                        })(r, c));

                        const type = grid[r][c];
                        if (type !== -1) {
                            const tile = document.createElement('div');
                            tile.className = 'tile';
                            tile.dataset.type = type;
                            tile.textContent = SYMBOLS[type] || '?';
                            cell.appendChild(tile);
                        }

                        boardElement.appendChild(cell);
                    }
                }
            }

            // Обновление отображения счёта
            function updateScore() {
                scoreDisplay.textContent = score;
            }

            // ======================== Инициализация новой игры ========================
            function initGame() {
                selectedCell = null;
                isAnimating = false;
                score = 0;
                updateScore();

                // Генерируем поле без начальных совпадений
                grid = generateBoard();

                // Убедимся, что есть хотя бы один возможный ход (если нет — перетасовка)
                if (!hasValidMoves()) {
                    shuffleBoard();
                }

                // Рендерим
                renderBoard();
            }

            // Обработчик кнопки "Новая игра"
            document.getElementById('restartBtn').addEventListener('click', function() {
                if (isAnimating) return;
                initGame();
            });

            // ======================== Запуск ========================
            initGame();

        })();
    </script>
</body>
</html>
