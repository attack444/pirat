<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Океан 2048 — иконка в морском стиле (глубины + плитка 2048 + жемчужина) -->
  <!-- Фон: градиент глубин океана -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6ea4"/>
      <stop offset="0.5" stop-color="#14558a"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2e6c9"/>
      <stop offset="1" stop-color="#d4af37"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#ocean)"/>

  <!-- Волны-блики -->
  <path d="M-20 150 Q60 110 140 150 T300 150 T460 150 T620 150" fill="none" stroke="#7fd0f7" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <path d="M-20 210 Q60 170 140 210 T300 210 T460 210 T620 210" fill="none" stroke="#7fd0f7" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- Плитка 2048 (основной элемент) -->
  <rect x="118" y="120" width="276" height="276" rx="42" fill="#e3b23c"/>
  <rect x="130" y="132" width="252" height="252" rx="34" fill="#f5c84b"/>

  <!-- Жемчужина на плитке -->
  <ellipse cx="236" cy="262" rx="74" ry="74" fill="url(#pearl)"/>
  <ellipse cx="214" cy="238" rx="26" ry="18" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="200" cy="228" rx="12" ry="8" fill="#ffffff" opacity="0.95"/>

  <!-- Подпись 2048 под жемчужиной -->
  <text x="256" y="368" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900"
        fill="#8a5a00" text-anchor="middle" letter-spacing="3">2048</text>

  <!-- Пузырьки -->
  <circle cx="120" cy="96" r="18" fill="#bfe9ff" opacity="0.6"/>
  <circle cx="404" cy="84" r="12" fill="#bfe9ff" opacity="0.5"/>
  <circle cx="452" cy="150" r="8" fill="#bfe9ff" opacity="0.45"/>
  <circle cx="96" cy="420" r="14" fill="#bfe9ff" opacity="0.5"/>
  <circle cx="430" cy="420" r="10" fill="#bfe9ff" opacity="0.45"/>
</svg>
