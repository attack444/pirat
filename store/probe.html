<!doctype html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<div id="ticks">0</div>
<script>
  var n = 0;
  var t = setInterval(function () {
    n++;
    document.getElementById('ticks').textContent = String(n);
    if (n >= 5) clearInterval(t);
  }, 200);
</script>
</body>
</html>
